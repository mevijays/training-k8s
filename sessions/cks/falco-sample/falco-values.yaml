# helm install falco falcosecurity/falco -n falco --create-namespace -f falco-values.yaml
driver:
  kind: modern_ebpf          # no kernel module build needed (kernel 5.8+)

tty: true                    # flush alerts to pod logs immediately

falco:
  json_output: true          # structured events for Sidekick / Loki / SIEM
  json_include_output_property: true
  priority: notice           # minimum priority to emit

# Falcosidekick fans alerts out to UIs, chat and observability tools
falcosidekick:
  enabled: true              # chart points Falco http_output at Sidekick automatically
  webui:
    enabled: true            # Falcosidekick UI on port 2802
    redis:
      storageEnabled: false  # lab only; enable a PV in real clusters
  serviceMonitor:
    enabled: false           # set true if kube-prometheus-stack is installed
  config:
    # Uncomment to send events to Loki (then view in Grafana)
    # loki:
    #   hostport: http://loki.monitoring.svc:3100
    #   minimumpriority: warning
    # slack:
    #   webhookurl: https://hooks.slack.com/services/XXX
    #   minimumpriority: critical

# Custom rules loaded after the default rules (so default macros like open_read work)
customRules:
  cks-rules.yaml: |-
    - rule: Read /dev/mem in container
      desc: A process inside a container opened /dev/mem
      condition: open_read and container and fd.name = /dev/mem
      output: >
        /dev/mem opened in container (user=%user.name command=%proc.cmdline
        container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: CRITICAL
      tags: [container, host, cks]
    - rule: Shell spawned in container
      desc: An interactive shell was started inside a container
      condition: spawned_process and container and proc.name in (bash, sh, zsh, ash)
      output: >
        %evt.time,%user.name,%container.id,%container.name,%k8s.pod.name,%proc.cmdline
      priority: WARNING
      tags: [container, shell, cks]
